<!doctype html>
<!-- data-theme="light" forteaza tema deschisa, indiferent de setarea sistemului.
     Scoate atributul ca sa reactivezi comutarea automata light/dark. -->
<html lang="ro" dir="ltr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anunțuri FABBV</title>
<meta name="description" content="Evenimentele zilei la Facultatea de Finanțe, Asigurări, Bănci și Burse de Valori — ASE București.">
<meta name="theme-color" content="#770101">
<meta name="color-scheme" content="light only">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FABBV">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- ======================= ICOANE (sprite) ======================= -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-bell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>
    </symbol>
    <symbol id="i-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
    </symbol>
    <symbol id="i-pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>
    </symbol>
    <symbol id="i-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
    </symbol>
    <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>
    </symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 11h18"/>
    </symbol>
    <symbol id="i-link" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10 13a5 5 0 0 0 7 0l2-2a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-2 2a5 5 0 0 0 7 7l1-1"/>
    </symbol>
    <symbol id="i-star" viewBox="0 0 24 24" fill="currentColor" stroke="none">
      <path d="m12 2 3.09 6.26L22 9.27l-5 4.87L18.18 22 12 18.56 5.82 22 7 14.14l-5-4.87 6.91-1.01L12 2Z"/>
    </symbol>
    <symbol id="i-inbox" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>
    </symbol>
    <symbol id="i-share" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 16V3"/><path d="m7 8 5-5 5 5"/><path d="M4 14v5a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-5"/>
    </symbol>
    <symbol id="i-plus-square" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="18" height="18" rx="2"/><path d="M12 8v8M8 12h8"/>
    </symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>
    </symbol>
    <symbol id="i-megafon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="m3 11 15-6v14l-15-6z"/><path d="M3 11v2a2 2 0 0 0 2 2h1"/><path d="M7 15v4a1 1 0 0 0 1 1h2a1 1 0 0 0 1-1v-3"/><path d="M21 9v4"/>
    </symbol>
    <symbol id="i-hourglass" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 2h12M6 22h12"/><path d="M6 2c0 4 3 5 6 10 3-5 6-6 6-10"/><path d="M6 22c0-4 3-5 6-10 3 5 6 6 6 10"/>
    </symbol>
    <symbol id="i-tag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20.6 13.4 12 22l-9-9V3h10l7.6 7.6a2 2 0 0 1 0 2.8Z"/><circle cx="7.5" cy="7.5" r="1.3"/>
    </symbol>
  </defs>
</svg>

<!-- ======================= HEADER ======================= -->
<header class="app-header">
  <div class="header-inner">
    <div class="brand">
      <img class="brand-logo" src="icons/logo-fabbv-alb.png"
           alt="Facultatea de Finanțe, Asigurări, Bănci și Burse de Valori">
      <h1 class="sr-only">Anunțuri FABBV — ASE București</h1>
      <div class="header-actions">
        <button class="icon-btn" id="btn-refresh" type="button" aria-label="Reîmprospătează evenimentele">
          <svg aria-hidden="true"><use href="#i-refresh"/></svg>
        </button>
        <button class="icon-btn" id="btn-notify" type="button" aria-label="Activează notificările zilnice">
          <svg aria-hidden="true"><use href="#i-bell"/></svg>
        </button>
      </div>
    </div>

    <div class="today-line">
      <span class="today-label">Astăzi</span>
      <span class="today-date" id="today-date">—</span>
    </div>
    <p class="today-count" id="today-count">Se încarcă…</p>

    <div class="search-wrap">
      <svg aria-hidden="true"><use href="#i-search"/></svg>
      <label class="sr-only" for="search">Caută evenimente</label>
      <input type="search" id="search" placeholder="Caută eveniment, sală, profesor…" autocomplete="off" enterkeyhint="search">
    </div>

    <div class="tabs" role="tablist" aria-label="Interval">
      <button class="tab" role="tab" data-range="azi" aria-selected="true">Azi <span class="tab-badge" data-count="azi">0</span></button>
      <button class="tab" role="tab" data-range="saptamana" aria-selected="false">Săptămâna asta <span class="tab-badge" data-count="saptamana">0</span></button>
      <button class="tab" role="tab" data-range="toate" aria-selected="false">Toate <span class="tab-badge" data-count="toate">0</span></button>
      <button class="tab" role="tab" data-range="anunturi" aria-selected="false">Anunțuri <span class="tab-badge" data-count="anunturi">0</span></button>
    </div>
  </div>
</header>

<!-- ======================= FILTRE ======================= -->
<nav class="cat-bar" aria-label="Filtrează după categorie">
  <div class="cat-bar-inner" id="cat-bar"></div>
</nav>

<!-- ======================= LISTĂ ======================= -->
<main id="list" aria-live="polite" aria-busy="true">
  <div class="skeleton"></div>
  <div class="skeleton"></div>
  <div class="skeleton"></div>
</main>

<footer class="app-footer">
  <div class="app-footer-inner">
    <img class="footer-logo" src="icons/logo-fabbv-alb.png"
         alt="Facultatea de Finanțe, Asigurări, Bănci și Burse de Valori">
    <p>Academia de Studii Economice din București</p>
    <p id="meta-line">Date actualizate din Google Sheet</p>
    <p><a href="https://fabbv.ase.ro" target="_blank" rel="noopener">fabbv.ase.ro</a></p>
  </div>
</footer>

<!-- ======================= DETALIU ======================= -->
<div class="scrim" id="scrim"></div>

<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" aria-hidden="true">
  <div class="sheet-grip"></div>
  <div class="sheet-inner" id="sheet-body"></div>
</section>

<!-- ======================= MODAL NOTIFICĂRI ======================= -->
<section class="modal" id="modal-notify" role="dialog" aria-modal="true" aria-labelledby="notify-title" aria-hidden="true">
  <div class="modal-icon" aria-hidden="true"><svg><use href="#i-bell"/></svg></div>
  <h2 id="notify-title">Notificări zilnice</h2>
  <div id="notify-content"></div>
</section>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/app.js"></script>
</body>
</html>
