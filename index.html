<!doctype html>
<!-- data-theme="light" forteaza tema deschisa, indiferent de setarea sistemului.
     Scoate atributul ca sa reactivezi comutarea automata light/dark. -->
<html lang="ro" dir="ltr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anunțuri FABBV</title>
<meta name="description" content="Evenimentele zilei la Facultatea de Finanțe, Asigurări, Bănci și Burse de Valori — ASE București.">
<meta name="theme-color" content="#770101">
<meta name="color-scheme" content="light only">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FABBV">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- ======================= ICOANE (sprite) ======================= -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-bell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>
    </symbol>
    <symbol id="i-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
    </symbol>
    <symbol id="i-pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>
    </symbol>
    <symbol id="i-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
    </symbol>
    <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>
    </symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 11h18"/>
    </symbol>
    <symbol id="i-link" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10 13a5 5 0 0 0 7 0l2-2a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-2 2a5 5 0 0 0 7 7l1-1"/>
    </symbol>
    <symbol id="i-star" viewBox="0 0 24 24" fill="currentColor" stroke="none">
      <path d="m12 2 3.09 6.26L22 9.27l-5 4.87L18.18 22 12 18.56 5.82 22 7 14.14l-5-4.87 6.91-1.01L12 2Z"/>
    </symbol>
    <symbol id="i-inbox" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>
    </symbol>
    <symbol id="i-share" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 16V3"/><path d="m7 8 5-5 5 5"/><path d="M4 14v5a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-5"/>
    </symbol>
    <symbol id="i-plus-square" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="18" height="18" rx="2"/><path d="M12 8v8M8 12h8"/>
    </symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>
    </symbol>
    <symbol id="i-busola" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5 5-2z"/>
    </symbol>
    <symbol id="i-lista" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/>
    </symbol>
    <symbol id="i-azi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 11h18"/><circle cx="12" cy="16" r="2" fill="currentColor" stroke="none"/>
    </symbol>
    <symbol id="i-megafon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="m3 11 15-6v14l-15-6z"/><path d="M3 11v2a2 2 0 0 0 2 2h1"/><path d="M7 15v4a1 1 0 0 0 1 1h2a1 1 0 0 0 1-1v-3"/><path d="M21 9v4"/>
    </symbol>
    <symbol id="i-hourglass" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 2h12M6 22h12"/><path d="M6 2c0 4 3 5 6 10 3-5 6-6 6-10"/><path d="M6 22c0-4 3-5 6-10 3 5 6 6 6 10"/>
    </symbol>
    <symbol id="i-tag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20.6 13.4 12 22l-9-9V3h10l7.6 7.6a2 2 0 0 1 0 2.8Z"/><circle cx="7.5" cy="7.5" r="1.3"/>
    </symbol>
    <symbol id="i-phone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.5 2.8.6a2 2 0 0 1 1.7 2Z"/>
    </symbol>
    <symbol id="i-chevron-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="m6 9 6 6 6-6"/>
    </symbol>
    <!-- siglele retelelor: contururi pline, desenate la 24x24 -->
    <symbol id="i-facebook" viewBox="0 0 24 24" fill="currentColor" stroke="none">
      <path d="M22 12.06C22 6.5 17.52 2 12 2S2 6.5 2 12.06c0 5.02 3.66 9.18 8.44 9.94v-7.03H7.9v-2.91h2.54V9.85c0-2.52 1.49-3.91 3.78-3.91 1.1 0 2.25.2 2.25.2v2.46h-1.26c-1.24 0-1.63.78-1.63 1.57v1.89h2.78l-.45 2.91h-2.33V22c4.78-.76 8.42-4.92 8.42-9.94Z"/>
    </symbol>
    <symbol id="i-linkedin" viewBox="0 0 24 24" fill="currentColor" stroke="none">
      <path d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.13 1.45-2.13 2.94v5.67H9.35V9h3.42v1.56h.05c.47-.9 1.63-1.85 3.37-1.85 3.6 0 4.26 2.37 4.26 5.45v6.29ZM5.34 7.43a2.07 2.07 0 1 1 0-4.13 2.07 2.07 0 0 1 0 4.13ZM7.12 20.45H3.56V9h3.56v11.45ZM22.22 0H1.77C.79 0 0 .77 0 1.73v20.54C0 23.22.79 24 1.77 24h20.45c.98 0 1.78-.78 1.78-1.73V1.73C24 .77 23.2 0 22.22 0Z"/>
    </symbol>
    <symbol id="i-instagram" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2.5" y="2.5" width="19" height="19" rx="5.4"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.6" cy="6.4" r="1.2" fill="currentColor" stroke="none"/>
    </symbol>
  </defs>
</svg>

<!-- ======================= HEADER ======================= -->
<header class="app-header">
  <div class="header-inner">
    <div class="brand">
      <img class="brand-logo" src="icons/logo-fabbv-alb.png"
           alt="Facultatea de Finanțe, Asigurări, Bănci și Burse de Valori">
      <h1 class="sr-only">Anunțuri FABBV — ASE București</h1>
      <div class="header-actions">
        <button class="icon-btn" id="btn-refresh" type="button" aria-label="Reîmprospătează evenimentele">
          <svg aria-hidden="true"><use href="#i-refresh"/></svg>
        </button>
        <button class="icon-btn" id="btn-notify" type="button" aria-label="Activează notificările zilnice">
          <svg aria-hidden="true"><use href="#i-bell"/></svg>
        </button>
      </div>
    </div>

    <div class="today-line">
      <span class="today-label">Astăzi</span>
      <span class="today-date" id="today-date">—</span>
    </div>
    <p class="today-count" id="today-count">Se încarcă…</p>

    <div class="search-wrap">
      <svg aria-hidden="true"><use href="#i-search"/></svg>
      <label class="sr-only" for="search">Caută evenimente</label>
      <input type="search" id="search" placeholder="Caută eveniment, sală, profesor…" autocomplete="off" enterkeyhint="search">
    </div>

  </div>
</header>

<!-- ======================= FILTRE ======================= -->
<nav class="cat-bar" aria-label="Filtrează după categorie">
  <div class="cat-bar-inner" id="cat-bar"></div>
</nav>

<!-- ======================= LISTĂ ======================= -->
<main id="list" aria-live="polite" aria-busy="true">
  <div class="skeleton"></div>
  <div class="skeleton"></div>
  <div class="skeleton"></div>
</main>

<footer class="app-footer">
  <div class="app-footer-inner">
    <img class="footer-logo" src="icons/logo-fabbv-alb.png"
         alt="Facultatea de Finanțe, Asigurări, Bănci și Burse de Valori">
    <p>Academia de Studii Economice din București</p>

    <!-- contact, preluat de pe fabbv.ase.ro -->
    <ul class="footer-contact">
      <li>
        <svg aria-hidden="true"><use href="#i-pin"/></svg>
        <span>Str. Mihail Moxa nr. 5–7, Sector 1, București</span>
      </li>
      <li>
        <svg aria-hidden="true"><use href="#i-phone"/></svg>
        <span><a href="tel:+40213191900">021.319.19.00</a> int. 571 / 565</span>
      </li>
    </ul>

    <!-- Follow us -->
    <nav class="footer-social" aria-label="Rețelele sociale ale facultății">
      <a href="https://www.facebook.com/share/1Jm2eDMyYN/?mibextid=wwXIfr"
         target="_blank" rel="noopener" aria-label="Facebook">
        <svg aria-hidden="true"><use href="#i-facebook"/></svg>
      </a>
      <a href="https://www.linkedin.com/school/fabbv/"
         target="_blank" rel="noopener" aria-label="LinkedIn">
        <svg aria-hidden="true"><use href="#i-linkedin"/></svg>
      </a>
      <a href="https://www.instagram.com/fabbv.ase?igsh=MWlzMGc3dnVjYTVudg%3D%3D&amp;utm_source=qr"
         target="_blank" rel="noopener" aria-label="Instagram">
        <svg aria-hidden="true"><use href="#i-instagram"/></svg>
      </a>
    </nav>

    <p id="meta-line">Date actualizate din Google Sheet</p>
    <p><a href="https://fabbv.ase.ro" target="_blank" rel="noopener">fabbv.ase.ro</a></p>
  </div>
</footer>

<!-- ======================= DETALIU ======================= -->
<div class="scrim" id="scrim"></div>

<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" aria-hidden="true">
  <div class="sheet-grip"></div>
  <div class="sheet-inner" id="sheet-body"></div>
</section>

<!-- ======================= MODAL NOTIFICĂRI ======================= -->
<section class="modal" id="modal-notify" role="dialog" aria-modal="true" aria-labelledby="notify-title" aria-hidden="true">
  <div class="modal-icon" aria-hidden="true"><svg><use href="#i-bell"/></svg></div>
  <h2 id="notify-title">Notificări zilnice</h2>
  <div id="notify-content"></div>
</section>

<nav class="bottom-nav" role="tablist" aria-label="Secțiuni">
  <button class="nav-item" role="tab" data-range="azi" aria-selected="true">
    <span class="nav-icon">
      <svg aria-hidden="true"><use href="#i-azi"/></svg>
      <span class="nav-badge" data-count="azi" hidden>0</span>
    </span>
    <span class="nav-label">Azi</span>
  </button>
  <button class="nav-item" role="tab" data-range="toate" aria-selected="false">
    <span class="nav-icon">
      <svg aria-hidden="true"><use href="#i-lista"/></svg>
      <span class="nav-badge" data-count="toate" hidden>0</span>
    </span>
    <span class="nav-label">Toate</span>
  </button>
  <button class="nav-item" role="tab" data-range="anunturi" aria-selected="false">
    <span class="nav-icon">
      <svg aria-hidden="true"><use href="#i-megafon"/></svg>
      <span class="nav-badge" data-count="anunturi" hidden>0</span>
    </span>
    <span class="nav-label">Anunțuri</span>
  </button>
  <button class="nav-item" role="tab" data-range="an" aria-selected="false">
    <span class="nav-icon">
      <svg aria-hidden="true"><use href="#i-busola"/></svg>
    </span>
    <span class="nav-label">An univ.</span>
  </button>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/app.js"></script>
</body>
</html>
