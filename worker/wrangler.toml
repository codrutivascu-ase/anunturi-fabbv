name = "anunturi-fabbv-push"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Rulează la 15 minute: destul de des ca un anunț nou să fie notificat
# prompt, iar rezumatul zilnic se auto-limitează la o trimitere pe zi.
# Nu putem programa direct 9:00 local: Cloudflare lucrează în UTC, iar
# ora de vară mută 9:00 de la București între 6:00 și 7:00 UTC.
[triggers]
crons = ["*/15 * * * *"]

[vars]
EVENTS_URL = "https://codrutivascu-ase.github.io/anunturi-fabbv/data/events.json"
ORIGIN_PERMIS = "https://codrutivascu-ase.github.io"
VAPID_SUBJECT = "mailto:ivascu_codrut@yahoo.com"

# Cheia publică VAPID nu e secretă: apare oricum în codul aplicației.
VAPID_PUBLIC_KEY = "BOnTwlO3AcECZxwvsL_L-3iDX9vyZKWVCiltB0k4J7udveP0k9NGYnXiUInvyhLXIzFuYkBwV4WeShv2MVT5WRY"

# Secretele NU stau aici. Se pun o singură dată, din linia de comandă:
#   npx wrangler secret put VAPID_PRIVATE_KEY
#   npx wrangler secret put CHEIE_TEST

# Sertarul cu abonamente, creat cu: npx wrangler kv namespace create ABONAMENTE
[[kv_namespaces]]
binding = "ABONAMENTE"
id = "2bf0a8ef49984c26ac87917ceceb867a"
